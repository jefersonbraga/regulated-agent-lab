[project]
name = "regulated-agent-lab"
version = "0.1.0"
description = "Multi-agent train-booking lab with human approval and regulated-sector controls (simulated data only)."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "langgraph",
    "langchain-core",
    "langchain-openai",
    "langchain-anthropic",
    "fastmcp>=2,<3",
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic>=2",
    "pyyaml",
    "python-dotenv",
    "langgraph-checkpoint-sqlite==3.1.3",
    "aiosqlite==0.22.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
# Terminal demo (request -> quote -> approval -> payment -> audit verify).
ral-cli = "regulated_agent_lab.agents.cli:main"
# A DEMO_USERS entry (password asked twice without echo; also in the API image).
ral-hash-password = "regulated_agent_lab.api.hash_password:main"
# Payments reconciliation report (processor record vs. ledger and runs).
ral-reconcile = "regulated_agent_lab.services.payments.reconcile:main"

[tool.uv]
package = true

# PyPA src layout: the one importable package is src/regulated_agent_lab.
[tool.hatch.build.targets.wheel]
packages = ["src/regulated_agent_lab"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Third-party: fastmcp imports the deprecated authlib.jose module. Ignore only that warning.
filterwarnings = ["ignore::authlib.deprecate.AuthlibDeprecationWarning"]
testpaths = ["tests", "evals"]
# backend/ on sys.path: shared helpers import as `tests.*` and `evals.conftest`.
pythonpath = ["."]
# Live evals call the real model: opt in with `pytest -m live` (a later -m overrides this one).
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["regulated_agent_lab"]
