name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (lint, tests, evals with mock model)
    runs-on: ubuntu-latest
    env:
      # Mock model only: CI needs no GPU, network endpoint or API keys. No secrets are used.
      LLM_PROVIDER: mock
      AGENT_TOKEN_SECRET: ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Tests and scenario evals
        run: uv run pytest -v

  ui:
    name: ui (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      # hashFiles() is not available in a job-level `if`, so each step is guarded instead.
      - uses: actions/setup-node@v4
        if: hashFiles('ui/package.json') != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        if: hashFiles('ui/package.json') != ''
        run: npm ci
      - name: Typecheck
        if: hashFiles('ui/package.json') != ''
        run: npm run typecheck
      - name: Tests
        if: hashFiles('ui/package.json') != ''
        run: npm test -- --run
      - name: Build
        if: hashFiles('ui/package.json') != ''
        run: npm run build
