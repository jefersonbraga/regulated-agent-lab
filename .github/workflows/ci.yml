name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (lint, tests, evals with mock model)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Mock model only: CI needs no GPU, network endpoint or API keys. No secrets are used.
      LLM_PROVIDER: mock
      AGENT_TOKEN_SECRET: ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . ../scripts
      - name: Format check
        run: uv run ruff format --check . ../scripts
      - name: Tests and scenario evals
        run: uv run pytest -v

  frontend:
    name: frontend (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test -- --run
      - name: Build
        run: npm run build
