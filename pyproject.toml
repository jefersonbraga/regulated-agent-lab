[project]
name = "regulated-agent-lab"
version = "0.1.0"
description = "Multi-agent train-booking lab with human approval and regulated-sector controls (simulated data only)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph",
    "langchain-core",
    "langchain-openai",
    "langchain-anthropic",
    "fastmcp>=2,<3",
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic>=2",
    "pyyaml",
    "python-dotenv",
    "langgraph-checkpoint-sqlite==3.1.3",
    "aiosqlite==0.22.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "controls", "mcp_servers", "api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Third-party: fastmcp imports the deprecated authlib.jose module. Ignore only that warning.
filterwarnings = ["ignore::authlib.deprecate.AuthlibDeprecationWarning"]
testpaths = ["tests", "evals"]
# Live evals call the real model: opt in with `pytest -m live` (a later -m overrides this one).
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
